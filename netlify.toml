# Netlify detects Next.js and applies its official runtime automatically.
# Runtime variables (DATABASE_URL, ADMIN_PASSWORD…) are set in the Netlify UI:
# Site configuration → Environment variables → Import from a .env file (see DEPLOY-NETLIFY.md).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
